services:
  mitm-forward:
    image: mitmproxy/mitmproxy:latest
    container_name: mitm-forward
    network_mode: host
    # Proxy listener reachable from host and containers via DOCKER_BRIDGE_IP:LOCAL_PORT
    # Web UI is bound to loopback only (host-only)
    command: >
      mitmweb
        --mode reverse:http://${TARGET_IP}:${TARGET_PORT}
        --listen-host ${DOCKER_BRIDGE_IP}
        --listen-port ${LOCAL_PORT}
        --web-host 127.0.0.1
        --web-port ${MITM_WEB_PORT}
        --set web_password='${MITM_WEB_PASSWORD:-ChangeMe}'
    restart: unless-stopped
