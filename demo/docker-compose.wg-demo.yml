# docker-compose.wg-demo.yml
#
# Demo: run a WireGuard "VPN server" inside a container, and have the *host* join it.
# Then, hit a demo HTTP endpoint that is reachable only via the WireGuard tunnel IP.
#
# Services:
#   wg     : WireGuard endpoint (container). Loads ./wg-server/wg0.conf.
#   demo   : tiny HTTP server sharing wg's network namespace (reachable only via wg IP).
#
# After bring-up, configure your host using ./wg-host.conf, then:
#   curl http://10.100.0.1:8080   # from host, through wg tunnel
#
services:
  wg:
    image: ghcr.io/linuxserver/wireguard:latest
    container_name: wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Zurich
    volumes:
      - ./local/wg-server:/config
    ports:
      - "51820:51820/udp"
    restart: unless-stopped

  demo:
    image: hashicorp/http-echo:1.0.0
    container_name: demo-over-wg
    network_mode: "service:wg"  # shares wg's namespace, reachable at 10.100.0.1
    command: ["-listen", ":8080", "-text", "Hello over WireGuard"]
    depends_on:
      - wg
