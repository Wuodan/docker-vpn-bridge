# wg-server/wg0.conf
#
# Container-side WireGuard config (server). Replace placeholders before starting.
# Address is the container's wg IP; we place demo HTTP on 10.100.0.1:8080.
#
# Generate keys:
#   SERVER_PRIVATE_KEY=$(wg genkey)
#   SERVER_PUBLIC_KEY=$(printf "%s" "$SERVER_PRIVATE_KEY" | wg pubkey)
#   HOST_PRIVATE_KEY=$(wg genkey)
#   HOST_PUBLIC_KEY=$(printf "%s" "$HOST_PRIVATE_KEY" | wg pubkey)
#
# Then replace the placeholders below and in ../wg-host.conf.
#
[Interface]
Address = 10.100.0.1/24
ListenPort = 51820
PrivateKey = __SERVER_PRIVATE_KEY__

# (Optional) basic firewall/NAT rules, not needed for this demo since we only
# access the demo service inside this namespace.
# PostUp = iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
# PostDown = iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

[Peer]
# host (your machine) as a client
PublicKey = __HOST_PUBLIC_KEY__
AllowedIPs = 10.100.0.2/32
PersistentKeepalive = 25
