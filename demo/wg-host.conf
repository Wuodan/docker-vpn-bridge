# wg-host.conf (use with `sudo wg-quick up ./wg-host.conf` on the host)
#
# Replace placeholders (see key generation in wg0.conf comments).
#
[Interface]
Address = 10.100.0.2/24
PrivateKey = __HOST_PRIVATE_KEY__
# Optional: use container as DNS for the demo
# DNS = 10.100.0.1

[Peer]
PublicKey = __SERVER_PUBLIC_KEY__
AllowedIPs = 10.100.0.0/24
Endpoint = 127.0.0.1:51820
PersistentKeepalive = 25
